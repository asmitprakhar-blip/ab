<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- SEO & Title -->
    <title>AuraBite - Care In Every Bite</title>
    <meta name="description" content="AuraBite interactive QR experience. Scan, Tap, Unlock More! Startup funding, Confess your crush, House parties & Blind dates." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AuraBite - Care In Every Bite" />
    <meta property="og:description" content="Scan, tap, and unlock exclusive experiences. Startup summit, blind dates, house parties & confess your crush." />
    <meta property="og:site_name" content="AuraBite" />
    <meta name="theme-color" content="#12372A" />

    <!-- Favicon -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

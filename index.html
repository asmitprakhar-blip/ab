<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=./menu.html" />
    <title>AuraBite | Redirecting...</title>
    <meta name="description" content="AuraBite premium food delivery and wellness-focused menu." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050b14;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #a3e635;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        text-align: center;
      }
      .wrap {
        padding: 2rem;
      }
      .badge {
        display: inline-block;
        padding: 0.45rem 0.8rem;
        border: 1px solid rgba(163, 230, 53, 0.4);
        border-radius: 999px;
        color: var(--accent);
        background: rgba(163, 230, 53, 0.08);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge">AuraBite</div>
      <h1>Redirecting to the homepage...</h1>
      <p>If you are not redirected automatically, <a href="./menu.html">click here</a>.</p>
    </div>
  </body>
</html>
